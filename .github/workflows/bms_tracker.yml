name: AMB BMS Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: amb-bms-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install tracker
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps firefox

      - name: Check AMB Cinemas
        run: python bms_tracker.py

      - name: Save tracker state
        if: success()
        run: |
          test -f amb_20260925_state.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp amb_20260925_state.json /tmp/amb_state.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/amb_state.json amb_20260925_state.json
            git add amb_20260925_state.json
            if git diff --cached --quiet; then
              echo "State unchanged."
              exit 0
            fi
            git commit -m "Update AMB tracker state"
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
